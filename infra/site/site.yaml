AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Octez Cloud website hosting: private S3 bucket behind CloudFront (OAC) with a strict
  security-header policy, a public release bucket for CloudFormation templates, and
  optional GitHub Actions deploy/release roles. Deploy in us-east-1 if the stack should create
  the TLS certificate (CloudFront certificates must be in us-east-1).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Custom domain (optional) }
        Parameters: [DomainName, IncludeWww, HostedZoneId, CertificateArn]
      - Label: { default: Storage }
        Parameters: [SiteBucketName]
      - Label: { default: CloudFront }
        Parameters: [PriceClass]
      - Label: { default: GitHub Actions (optional) }
        Parameters: [GitHubRepository, CreateGitHubOidcProvider]

Parameters:
  DomainName:
    Type: String
    Default: ""
    Description: Custom domain for the site, e.g. octezcloud.org. Leave empty to use the CloudFront domain.
  IncludeWww:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Also serve www.<DomainName>, which redirects to the bare domain.
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 hosted zone ID for DomainName. If set, A/AAAA alias records are created and, unless
      CertificateArn is given, a DNS-validated ACM certificate is created (stack must be in us-east-1).
  CertificateArn:
    Type: String
    Default: ""
    Description: >-
      Existing ACM certificate in us-east-1 covering DomainName (and www.DomainName if IncludeWww).
      Leave empty to have the stack create one (needs HostedZoneId).
  SiteBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: >-
      Name for the private site bucket. Leave empty for a generated name. Visitors never see it.
      The bucket must not already exist (delete it first, or import it into the stack).
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
  GitHubRepository:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: owner/repo allowed to deploy the site (from main) and publish releases (from v* tags). Empty disables both roles.
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if this account already has the token.actions.githubusercontent.com OIDC provider.

Rules:
  CertificateForDomain:
    RuleCondition: !Not [!Equals [!Ref DomainName, ""]]
    Assertions:
      - Assert: !Or [!Not [!Equals [!Ref CertificateArn, ""]], !Not [!Equals [!Ref HostedZoneId, ""]]]
        AssertDescription: With DomainName set, give CertificateArn, or HostedZoneId so the stack can create a certificate.
  CreatedCertificateNeedsUsEast1:
    RuleCondition: !And
      - !Not [!Equals [!Ref DomainName, ""]]
      - !Equals [!Ref CertificateArn, ""]
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: CloudFront needs its certificate in us-east-1. Deploy this stack there, or pass CertificateArn.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasZone: !And [!Condition HasDomain, !Not [!Equals [!Ref HostedZoneId, ""]]]
  HasWww: !And [!Condition HasDomain, !Equals [!Ref IncludeWww, "true"]]
  HasZoneWww: !And [!Condition HasZone, !Condition HasWww]
  CreateCert: !And [!Condition HasZone, !Equals [!Ref CertificateArn, ""]]
  HasSiteBucketName: !Not [!Equals [!Ref SiteBucketName, ""]]
  HasGitHub: !Not [!Equals [!Ref GitHubRepository, ""]]
  CreateOidc: !And [!Condition HasGitHub, !Equals [!Ref CreateGitHubOidcProvider, "true"]]

Resources:
  # ---------------------------------------------------------------- site bucket
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasSiteBucketName, !Ref SiteBucketName, !Ref AWS::NoValue]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 90 }
      Tags:
        - { Key: managed-by, Value: octez-cloud }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  # ------------------------------------------------------------- release bucket
  # CloudFormation "Launch Stack" links must point at a template in S3, so
  # released templates are served straight from this bucket. Only the
  # releases/ prefix is public.
  ReleaseBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3600
      Tags:
        - { Key: managed-by, Value: octez-cloud }

  ReleaseBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReleaseBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadReleases
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${ReleaseBucket.Arn}/releases/*"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ReleaseBucket.Arn, !Sub "${ReleaseBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  # ----------------------------------------------------------------- CloudFront
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # "/docs/keys/" -> "/docs/keys/index.html", "/docs/keys" -> "/docs/keys/index.html".
  # Must match the rule in web/scripts/build.mjs (dev server). Also 301s www. to the bare domain.
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-index-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Directory index rewrite
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          var CANONICAL = '${Canonical}';
          function handler(event) {
            var req = event.request;
            var host = req.headers.host ? req.headers.host.value : '';
            if (CANONICAL && host === 'www.' + CANONICAL) {
              var qs = [];
              for (var k in req.querystring) {
                var q = req.querystring[k];
                qs.push(encodeURIComponent(k) + (q.value ? '=' + encodeURIComponent(q.value) : ''));
              }
              return {
                statusCode: 301,
                statusDescription: 'Moved Permanently',
                headers: { location: { value: 'https://' + CANONICAL + req.uri + (qs.length ? '?' + qs.join('&') : '') } }
              };
            }
            var uri = req.uri;
            if (uri.endsWith('/')) {
              req.uri = uri + 'index.html';
            } else if (uri.split('/').pop().indexOf('.') === -1) {
              req.uri = uri + '/index.html';
            }
            return req;
          }
        - Canonical: !Ref DomainName

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: Strict headers. The site is the main attack surface, so keep the CSP tight.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'none';
              script-src 'self';
              style-src 'self';
              img-src 'self' data:;
              font-src 'self';
              connect-src 'self';
              manifest-src 'self';
              base-uri 'none';
              form-action 'none';
              frame-ancestors 'none';
              upgrade-insecure-requests;
              require-trusted-types-for 'script'
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
          ContentTypeOptions: { Override: true }
          FrameOptions: { Override: true, FrameOption: DENY }
          ReferrerPolicy: { Override: true, ReferrerPolicy: no-referrer }
          XSSProtection: { Override: true, Protection: false }
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), interest-cohort=()"
            - Header: Cross-Origin-Opener-Policy
              Override: true
              Value: same-origin
            - Header: Cross-Origin-Resource-Policy
              Override: true
              Value: same-origin
        RemoveHeadersConfig:
          Items:
            - Header: x-amz-server-side-encryption
            - Header: x-amz-version-id

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030] # CertificateArn defaults to "" and is only used when DomainName is set
    Properties:
      DistributionConfig:
        Comment: Octez Cloud website
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        Aliases: !If
          - HasWww
          - [!Ref DomainName, !Sub "www.${DomainName}"]
          - !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !If [CreateCert, !Ref Certificate, !Ref CertificateArn]
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionARN
        # Without s3:ListBucket, S3 answers 403 for missing keys.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
      Tags:
        - { Key: managed-by, Value: octez-cloud }

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCert
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: !If [HasWww, [!Sub "www.${DomainName}"], !Ref AWS::NoValue]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - !If
          - HasWww
          - DomainName: !Sub "www.${DomainName}"
            HostedZoneId: !Ref HostedZoneId
          - !Ref AWS::NoValue
      Tags:
        - { Key: managed-by, Value: octez-cloud }

  DnsA:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone
  DnsAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DnsWwwA:
    Type: AWS::Route53::RecordSet
    Condition: HasZoneWww
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  DnsWwwAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasZoneWww
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ------------------------------------------------------------ GitHub Actions
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  # Deploys the site from main. Cannot touch releases.
  SiteDeployRole:
    Type: AWS::IAM::Role
    Condition: HasGitHub
    Properties:
      Description: GitHub Actions (main branch) deploys the static site
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
              - Effect: Allow
                Action: [cloudformation:DescribeStacks]
                Resource: !Ref AWS::StackId
      Tags:
        - { Key: managed-by, Value: octez-cloud }

  # Publishes release artifacts from v* tags. Can add objects but not delete them;
  # the bucket is versioned, so an overwrite is visible and recoverable.
  ReleasePublishRole:
    Type: AWS::IAM::Role
    Condition: HasGitHub
    Properties:
      Description: GitHub Actions (v* tags) publishes release templates
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:ref:refs/tags/v*"
      Policies:
        - PolicyName: publish-release
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt ReleaseBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${ReleaseBucket.Arn}/releases/*"
      Tags:
        - { Key: managed-by, Value: octez-cloud }

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
  ReleaseBucketName:
    Value: !Ref ReleaseBucket
  ReleasesBaseUrl:
    Description: Pass to the site build as RELEASES_BASE_URL
    Value: !Sub "https://${ReleaseBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/releases"
  SiteDeployRoleArn:
    Condition: HasGitHub
    Value: !GetAtt SiteDeployRole.Arn
  ReleasePublishRoleArn:
    Condition: HasGitHub
    Value: !GetAtt ReleasePublishRole.Arn
