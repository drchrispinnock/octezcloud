name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck && npm test && npm run build
        working-directory: web
      - run: pip install cfn-lint && cfn-lint infra/site/site.yaml

  deploy:
    # Configure repository variables AWS_REGION and AWS_SITE_DEPLOY_ROLE_ARN
    # (the SiteDeployRoleArn output of infra/site/site.yaml) to enable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_SITE_DEPLOY_ROLE_ARN != ''
    needs: check
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: site-deploy, cancel-in-progress: false }
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: scripts/deploy-site.sh "${{ vars.SITE_STACK_NAME || 'octez-cloud-site' }}"
        env:
          SITE_COMMIT: ${{ github.sha }}
